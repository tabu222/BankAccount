name: CI - Test & Allure Report

# Khi nào pipeline chạy: mỗi lần push lên nhánh main, mỗi pull request, hoặc bấm tay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      # Các bước dưới vẫn chạy kể cả khi test FAIL, để báo cáo luôn được tạo
      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate Allure report
        if: always()
        run: npx -y allure@3.22.1 generate allure-results

      - name: Upload report
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy:
    name: Publish report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5